name: Daily Ingest Pipeline

on:
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC daily
  workflow_dispatch:
    inputs:
      scraper:
        description: 'Scraper to run (leave empty for all)'
        required: false
        type: string
      limit:
        description: 'Max pages per scraper'
        required: false
        type: string
      dry_run:
        description: 'Dry run mode'
        required: false
        type: boolean
        default: false

concurrency:
  group: ingest-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    name: Scrape ${{ matrix.scraper }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        scraper: [youthop, ofy, opdesk, afterschool, scholads]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run scraper
        run: pnpm pipeline:ci -- --scraper=${{ matrix.scraper }}${{ github.event.inputs.limit && format(' --limit={0}', github.event.inputs.limit) || '' }}${{ github.event.inputs.dry_run == 'true' && ' --dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
